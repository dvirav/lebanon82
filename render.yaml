# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render reads this on "New > Blueprint" and creates the service pre-configured.

services:
  - type: web
    name: lebanon82
    runtime: python
    region: frankfurt # closest of Render's regions to Israel
    # NOT the free plan: free services sleep after ~15 minutes idle, take up to a
    # minute to wake, and lose the in-memory room state when they do.
    plan: starter
    # ONE instance only: the room state and votes live in memory.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render terminates TLS, so without it the QR would encode http://
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --ws-max-size 65536
    healthCheckPath: /healthz
    # Content saved from the editor (?role=edit). The service filesystem is wiped on
    # every deploy/restart, so it lives on a persistent disk. Without the disk the
    # site still works, but edits are lost on the next deploy.
    disk:
      name: content
      mountPath: /var/data
      sizeGB: 1
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # The secret in the screen/remote links (?key=...). Render generates a random
      # value; copy it from the dashboard. Unset = nobody can present.
      - key: PRESENTER_KEY
        generateValue: true
      - key: CONTENT_PATH
        value: /var/data/content.json
